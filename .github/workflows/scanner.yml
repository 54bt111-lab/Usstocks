name: US Stock L3-MBO Scanner

on:
  schedule:
    # تشغيل كل 15 دقيقة لتغطية جميع الجلسات (Premarket, Market, Postmarket) أيام التداول (1-5)
    - cron: '*/15 8-23 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write # ضروري جداً لمنح البوت صلاحية التعديل وحفظ ملف الذاكرة

jobs:
  run-scanner:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install requests yfinance pandas numpy

      - name: Run US Scanner
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python main.py

      - name: Commit and Push Alert History
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add alerts_history.json
          git diff --staged --quiet || (git commit -m "Auto-update alerts history" && git push)
